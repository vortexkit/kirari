name: Linked issue

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  issues: read

jobs:
  linked-issue:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
        run: |
          numbers=$(printf '%s\n' "$PR_BODY" | grep -oiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' | grep -oE '[0-9]+$' | sort -u || true)
          for number in $numbers; do
            if [ "$(gh api "repos/$REPO/issues/$number" --jq '.pull_request == null' 2>/dev/null)" = true ]; then
              echo "Closes #$number."
              exit 0
            fi
          done
          echo "::error::This PR doesn't close an issue. Open an issue first, then add 'Closes #<issue>' to the PR description (CONTRIBUTING.md, Pull requests)."
          exit 1
