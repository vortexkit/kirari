# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
inheritance: true
language: "en-US"
early_access: false
tone_instructions: "Review Kirari as a TypeScript syntax-highlighting library. Keep feedback concise and actionable, prioritizing correctness, streaming consistency, public API compatibility, and bundle size."
reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
    auto_pause_after_reviewed_commits: 0
  path_filters:
    - "!**/.zed/**"
  path_instructions:
    - path: "packages/kirari/src/**/*.ts"
      instructions: |
        Review Kirari's tokenizer, grammars, renderer, and streaming API. Ensure that:
        - Preserve exact source text, contiguous UTF-16 token offsets, custom token categories, and HTML escaping.
        - Keep streamed patches equivalent to full tokenization across chunk boundaries, incomplete source, and reset/end calls.
        - Preserve safe resume checkpoints and lookahead caches; check adversarial inputs for repeated rescanning.
        - Preserve public exports, language coverage, tree shaking, and dependency-free browser/server support.
        - Verify bundle-size claims with `bun run size` and keep existing size budgets.
    - path: "packages/react/src/**/*.{ts,tsx}"
      instructions: |
        Review the React rendering and streaming integration. Ensure that:
        - Keep static Code rendering compatible with Server Components and hooks in the client entry point.
        - Reuse core tokenization and decoration logic, and render source as React text children.
        - Preserve token-patch application, language-change resets, and protection against stale stream callbacks.
    - path: "packages/rehype/src/**/*.ts"
      instructions: |
        Review the Rehype integration and code-block metadata handling. Ensure that:
        - Preserve source text and existing pre/code properties when transforming HAST nodes.
        - Keep code content as text nodes and attributes as HAST properties for safe serialization.
        - Preserve language aliases, unknown-language fallback, metadata parsing, and line decorations.
chat:
  auto_reply: true
